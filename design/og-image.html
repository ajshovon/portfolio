<!doctype html>
<!--
  Source of src/assets/images/og-image.png, the 1200x630 image shown in link previews.

  To regenerate it after editing this file, run a Chromium-based browser from the repository root:

    chrome --headless --hide-scrollbars --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=src/assets/images/og-image.png design/og-image.html

  The colors mirror the dark theme in src/styles/global.css.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>[.shovon] link preview image</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@900&family=Red+Hat+Mono:wght@400;500;700&display=block" />
    <style>
      :root {
        --bg: #0b0d10;
        --surface: #111419;
        --raised: #181c22;
        --line: #262b34;
        --fg: #e6e8eb;
        --muted: #8e96a3;
        --faint: #606774;
        --accent: #4ade80;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Red Hat Mono', monospace;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(38 43 52 / 0.75) 1px, transparent 1px),
          linear-gradient(90deg, rgb(38 43 52 / 0.75) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(ellipse 85% 95% at 25% 0%, #000 15%, transparent 78%);
      }

      .glow {
        position: absolute;
        top: 40px;
        right: -140px;
        width: 760px;
        height: 560px;
        background: radial-gradient(closest-side, rgb(74 222 128 / 0.17), transparent);
      }

      .accent {
        color: var(--accent);
      }

      .caret {
        display: inline-block;
        width: 0.55em;
        height: 1.1em;
        background: var(--accent);
        vertical-align: -0.18em;
      }

      .bar {
        position: absolute;
        top: 50px;
        right: 72px;
        left: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 24px;
        color: var(--muted);
      }

      .mark {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--fg);
      }

      .who {
        position: absolute;
        top: 140px;
        left: 72px;
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .who img {
        width: 86px;
        height: 86px;
        border: 1px solid var(--line);
        border-radius: 22px;
      }

      .role {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 27px;
        font-weight: 500;
      }

      .role i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
      }

      .place {
        margin-top: 6px;
        font-size: 23px;
        color: var(--muted);
      }

      h1 {
        position: absolute;
        top: 248px;
        left: 68px;
        font: 900 106px/0.94 'Red Hat Display', sans-serif;
        letter-spacing: -0.03em;
      }

      .terminal {
        position: absolute;
        top: 156px;
        right: 72px;
        width: 440px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 30px 60px rgb(0 0 0 / 0.45);
      }

      .terminal header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--raised);
        font-size: 17px;
        color: var(--muted);
      }

      .terminal header span {
        display: flex;
        gap: 8px;
      }

      .terminal header i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--line);
      }

      .terminal div {
        padding: 24px 26px 28px;
        font-size: 20px;
        line-height: 1.55;
      }

      .terminal p + p.cmd {
        margin-top: 14px;
      }

      .terminal p:not(.cmd) {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="glow"></div>

    <div class="bar">
      <span class="mark"><span class="accent">[</span>.shovon<span class="accent">]</span> <span class="caret"></span></span>
      <span>shovon.me</span>
    </div>

    <div class="who">
      <img src="../src/assets/images/61104583.jpg" alt="" />
      <div>
        <p class="role"><i></i>DevOps Engineer</p>
        <p class="place">Dhaka, Bangladesh</p>
      </div>
    </div>

    <h1>Jubayer<br />Ahmad<br /><span class="accent">Shovon</span></h1>

    <section class="terminal">
      <header>
        <span><i></i><i></i><i></i></span>
        shovon@web: ~
      </header>
      <div>
        <p class="cmd"><span class="accent">$</span> whoami</p>
        <p>jubayer ahmad shovon</p>
        <p class="cmd"><span class="accent">$</span> cat role.txt</p>
        <p>devops engineer, dhaka (bd)</p>
        <p class="cmd"><span class="accent">$</span> cat interests.txt</p>
        <p>tech, anime, all things geeky</p>
        <p class="cmd"><span class="accent">$</span> <span class="caret"></span></p>
      </div>
    </section>
  </body>
</html>
